backend:
  name: github
  repo: mitchelltransue/pokemon-firered-leafgreen-team-builder
  branch: main
  site_domain: 6f617888-9394-4431-a607-cb602e4d7ab0.netlify.app

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog Posts
    folder: _posts
    create: true
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish Date
        name: date
        widget: datetime
      - label: Description
        name: description
        widget: string
      - label: Category
        name: category
        widget: select
        options: [Guide, Team Tips, Nuzlocke, Type Coverage]
      - label: Body
        name: body
        widget: markdown
